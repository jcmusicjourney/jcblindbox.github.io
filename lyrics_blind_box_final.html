function getFilteredSongs() {
const lang = document.getElementById('language-type').value;
const theme = document.getElementById('theme-type').value;
const era = document.getElementById('era-type').value;
return songs.filter(song => {
const matchLang = (lang === 'all-languages' || song.language.toLowerCase() === lang);
const matchTheme = (theme === 'all-themes' || song.theme.toLowerCase() === theme);
const matchEra = (era === 'all-eras' || ((era === '80s' && song.year >= 1980 && song.year < 1990) || (era === '90s' && song.year >= 1990 && song.year < 2000) || (era === '2000s' && song.year >= 2000)));
return matchLang && matchTheme && matchEra;
});
}

function showRandomLyric() {
const currentFiltered = getFilteredSongs();
if (currentFiltered.length === 0) {
document.getElementById('lyric-display').innerHTML = "<p class='lyric-text'>沒有符合條件的歌詞！</p>";
return;
}
const randomSong = currentFiltered[Math.floor(Math.random() * currentFiltered.length)];
displaySong(randomSong);
}

function displaySong(song) {
const embedUrl = song.youtubeEmbed;
document.getElementById('lyric-display').innerHTML = `<p class='lyric-text'>${song.lyric.replace(/\n/g, '<br>')}</p>
<div class='song-info'>
<p><strong>歌名：</strong>${song.title}</p>
<p>作曲: ${song.composer} | 填詞: ${song.lyricist} | 編曲: ${song.arranger} | 監製: ${song.producer}</p>
<p><strong>年份：</strong>${song.year}</p>
</div>
<div class='youtube-container'><iframe src='${embedUrl}' frameborder='0' allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' allowfullscreen></iframe></div>`;
}

document.getElementById('random-lyric-button').addEventListener('click', showRandomLyric);
</script>
